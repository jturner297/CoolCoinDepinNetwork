<!DOCTYPE html>
<html lang="en">
  <head>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cool-Coin Network Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --header-bg: #000000;
        --main-bg: #0d0d0d;
        --sidebar-bg: #212121;
        --card-bg: #151515;
        --node-card-bg: #141414;
        --accent-purple: #e392fa;
        --accent-blue: #87ceeb;
        --text-main: #ffffff;
        --text-dim: #a0a0a0;
        --online-green: #00ff55;
        --offline-red: #ff0059;
        --idle-yellow: #f6c445;
      }

      body {
        font-family: "DM Sans", sans-serif;
        background-color: var(--main-bg);
        color: var(--text-main);
        margin: 0;
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
      }

      /* Header */
      header {
        background-color: var(--header-bg);
        padding: 15px 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 10;
        flex-shrink: 0;
      }
      .header-left h1 {
        color: var(--accent-purple);
        font-size: 1.6rem;
        font-weight: 1000;
        margin: 0 0 -3px 0;
      }
      .header-left p {
        font-size: 0.95rem;
        font-weight: 500;
        color: var(--text-main);
        margin: 0 0 10px 0;
      }

      /* Server Controls */
      .server-input {
        background: #444;
        border: none;
        border-radius: 20px;
        padding: 4px 15px;
        color: #ccc;
        font-family: "DM Sans", sans-serif;
        font-size: 0.8rem;
      }
      .server-input.address {
        width: 75px;
        margin-right: 5px;
      }
      .server-input.port {
        width: 50px;
      }
      #server-display {
        display: flex;
        align-items: center;
        gap: 6px;
        width: 100%;
        background: #444;
        border-radius: 20px;
        padding: 4px 15px;
      }
      #server-display span {
        flex: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        color: #ccc;
        font-size: 0.8rem;
      }
      #server-container {
        width: 245px;
        height: 28px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      #serverSubmitBtn {
        background: var(--accent-purple);
        border: none;
        border-radius: 50px;
        padding: 4px 10px;
        color: #ffffff;
        font-family: "DM Sans", sans-serif;
        font-size: 0.75rem;
        cursor: pointer;
      }
      .logo-img {
        width: 80px;
        height: 80px;
      }

      /* Layout */
      .layout {
        display: flex;
        flex: 1;
        overflow: hidden;
      }

      /* Sidebar */
      aside {
        width: 250px;
        background-color: var(--sidebar-bg);
        padding: 30px 20px;
        display: flex;
        flex-direction: column;
        overflow-y: auto;
        flex-shrink: 0;
      }
      aside h3 {
        color: var(--accent-purple);
        margin-bottom: 10px;
        font-size: 1.1rem;
      }
      aside h3.wallet-header {
        color: var(--accent-blue);
        margin-top: 30px;
      }

      .node-card {
        background: var(--node-card-bg);
        padding: 15px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        cursor: pointer;
        margin-bottom: 10px;
        transition: outline 0.1s;
      }
      .node-card.active-node {
        outline: 2px solid var(--accent-purple);
      }
      .node-card.active-wallet {
        outline: 2px solid var(--accent-blue);
      }

      .node-input-card {
        cursor: text;
        margin-bottom: 15px;
        padding: 12px 15px;
        transition: opacity 0.3s;
      }
      .node-input {
        background: transparent;
        border: none;
        color: #ccc;
        width: 100%;
        font-family: "DM Sans", sans-serif;
        font-size: 0.85rem;
        outline: none;
      }

      .node-card span:first-child {
        flex: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 0;
        margin-right: 10px;
        font-size: 0.9rem;
      }
      .node-card span:last-child {
        flex-shrink: 0;
        color: #666;
        font-weight: bold;
      }
      .node-card span:last-child:hover {
        color: #fff;
      }

      /* Main Content */
      main {
        flex: 1;
        padding: 20px 40px;
        overflow-y: auto;
        max-width: 1000px;
        margin-right: auto;
      }

      /* View Containers */
      .view-section {
        display: none;
      }
      .view-section.active {
        display: block;
      }

      /* Stats Grid */
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        margin-bottom: 30px;
      }
      .stat-card {
        background: var(--card-bg);
        padding: 20px;
        border-radius: 15px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .stat-label {
        color: var(--text-dim);
        font-size: 0.9rem;
        margin-bottom: 5px;
      }
      .stat-value {
        font-size: 1.8rem;
        font-weight: 500;
      }
      .wallet-val {
        color: var(--accent-blue);
      }

      /* Transaction History List */
      .tx-history-container {
        background: var(--card-bg);
        border-radius: 20px;
        padding: 20px;
        height: 240px;
        overflow-y: auto;
      }
      .tx-row {
        display: flex;
        justify-content: space-between;
        padding: 12px 0;
        border-bottom: 1px solid #222;
        font-size: 0.9rem;
      }
      .tx-row:last-child {
        border-bottom: none;
      }
      .tx-type-mint {
        color: var(--online-green);
        font-weight: bold;
      }
      .tx-type-transfer {
        color: var(--idle-yellow);
        font-weight: bold;
      }
      .tx-time {
        color: var(--text-dim);
        font-size: 0.8rem;
      }
      .tx-amount {
        font-family: monospace;
        font-size: 1rem;
      }

      /* Details Panel */
      .details-text {
        margin-top: 20px;
        font-size: 0.95rem;
        line-height: 1.6;
      }
      .details-header {
        margin: 0 0 8px 0;
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--accent-purple);
      }
      .detail-row {
        display: flex;
        gap: 8px;
        margin-bottom: 4px;
      }
      .detail-val-purple {
        color: var(--accent-purple);
      }
      .detail-val-blue {
        color: var(--accent-blue);
      }
      .detail-val-green {
        color: var(--online-green);
      }
      /* --- FIXED: Added Missing Status Colors --- */
      .detail-val-yellow {
        color: var(--idle-yellow);
      }
      .detail-val-red {
        color: var(--offline-red);
      }
      /* ------------------------------------------ */
      .detail-val-white {
        color: #fff;
        word-break: break-all;
      }

      /* Graph Styles */
      .trends-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        margin-bottom: 15px;
      }
      .trends-header h2 {
        color: var(--accent-purple);
        margin: 0;
      }
      .graph-tabs {
        display: flex;
        gap: 5px;
        background: #222;
        padding: 4px;
        border-radius: 8px;
      }
      .graph-tabs .tab {
        background: transparent;
        border: none;
        color: #888;
        padding: 6px 12px;
        border-radius: 6px;
        cursor: pointer;
        font-family: "DM Sans", sans-serif;
      }
      .graph-tabs .tab.active {
        background: var(--accent-purple);
        color: black;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="header-left">
        <h1>Cool-Coin Network</h1>
        <p>Dashboard</p>
        <div id="server-container">
          <div id="server-display" style="display: none">
            <span id="serverUrlSpan"></span>
          </div>
          <div class="server-input-group" id="server-edit">
            <input
              type="text"
              id="serverAddress"
              class="server-input address"
              placeholder="address"
            />
            <input
              type="text"
              id="serverPort"
              class="server-input port"
              placeholder="port"
            />
          </div>
          <button id="serverSubmitBtn">Set</button>
        </div>
      </div>
      <a
        href="https://github.com/jturner297/CoolCoinDepinNetwork.git"
        target="_blank"
        rel="noopener noreferrer"
      >
        <img
          src="../_resources/CoolCoinLogo.png"
          alt="Cool-Coin Logo"
          class="logo-img"
        />
      </a>
    </header>

    <div class="layout">
      <aside>
        <h3>Nodes</h3>
        <div class="node-card node-input-card">
          <input
            type="text"
            class="node-input"
            id="nodeInput"
            placeholder="Add Node (ID or Nickname)"
          />
        </div>
        <div id="node-list"></div>

        <h3 class="wallet-header">Wallets</h3>
        <div class="node-card node-input-card">
          <input
            type="text"
            class="node-input"
            id="walletInput"
            placeholder="Add Wallet Public Key"
          />
        </div>
        <div id="wallet-list"></div>
      </aside>

      <main>
        <div id="node-view" class="view-section">
          <h2 style="color: var(--accent-purple)">Environmental Stats</h2>
          <div class="stats-grid">
            <div class="stat-card">
              <span class="stat-label">Temperature</span>
              <span class="stat-value" id="tempDisplay">-- °C</span>
            </div>
            <div class="stat-card">
              <span class="stat-label">Pressure</span>
              <span class="stat-value" id="presDisplay">-- hPa</span>
            </div>
            <div class="stat-card">
              <span class="stat-label">Humidity</span>
              <span class="stat-value" id="humDisplay">-- %</span>
            </div>
          </div>

          <div class="trends-header">
            <h2>Activity Trends</h2>
            <div
              style="
                font-size: 0.8rem;
                color: var(--text-dim);
                margin-bottom: 5px;
              "
            >
              High:
              <span
                id="highVal"
                style="color: var(--accent-purple); font-weight: bold"
                >--</span
              >
              | Low:
              <span id="lowVal" style="color: #97c2ff; font-weight: bold"
                >--</span
              >
            </div>
            <div class="graph-tabs">
              <button class="tab active" onclick="setGraphMode('temp')">
                Temp
              </button>
              <button class="tab" onclick="setGraphMode('pres')">
                Pressure
              </button>
              <button class="tab" onclick="setGraphMode('hum')">
                Humidity
              </button>
            </div>
          </div>

          <div style="position: relative; height: 300px; width: 100%">
            <canvas id="trendChart"></canvas>
          </div>
          <div class="details-text" id="node-details"></div>
        </div>

        <div id="wallet-view" class="view-section">
          <h2 style="color: var(--accent-blue)">Financial Stats</h2>
          <div class="stats-grid">
            <div class="stat-card">
              <span class="stat-label">Confirmed Balance</span>
              <span class="stat-value wallet-val" id="walletConfirmed">--</span>
            </div>
            <div class="stat-card">
              <span class="stat-label">Pending (Mined)</span>
              <span class="stat-value wallet-val" id="walletPending">--</span>
            </div>
            <div class="stat-card">
              <span class="stat-label">Total Balance</span>
              <span class="stat-value wallet-val" id="walletTotal">--</span>
            </div>
          </div>

          <h2 style="color: var(--accent-blue)">Transaction History</h2>
          <div class="tx-history-container" id="txHistory">
            <div style="text-align: center; color: #666; margin-top: 50px">
              Select a wallet to view transactions
            </div>
          </div>
          <div class="details-text" id="wallet-details-text"></div>
        </div>
      </main>
    </div>

    <script>
      // ================= Global State =================
      let SERVER_URL = null;
      let isEditing = true;
      const MAX_ITEMS = 3; // <--- STRICT LIMIT OF 3

      let trackedNodes = [];
      let trackedWallets = [];
      let nodeNameCache = {};

      let activeType = null;
      let activeIndex = null;

      let cachedChartData = [];
      let myChart = null;
      let currentMode = "temp";
      let lastHeartbeat = {};
      let lastKnownSig = {};

      const MODES = {
        temp: {
          label: "Temperature (°C)",
          color: "#e392fa",
          gradient: true,
          unit: "°C",
        },
        hum: {
          label: "Humidity (%)",
          color: "#add8e6",
          gradient: true,
          unit: "%",
        },
        pres: {
          label: "Pressure (hPa)",
          color: "#00ff55",
          gradient: false,
          unit: "hPa",
        },
      };
      const Y_SCALES = {
        temp: { buffer: 2, step: 1 },
        hum: { buffer: 15, step: 10 },
        pres: { buffer: 4, step: 5 },
      };

      // ================= Helper Utilities =================
      function cleanKey(key) {
        if (!key) return "";
        return key
          .replace("-----BEGIN PUBLIC KEY-----", "")
          .replace("-----END PUBLIC KEY-----", "")
          .replace(/\s+/g, "");
      }

      function createGradient(ctx, color) {
        const gradient = ctx.createLinearGradient(0, 0, 0, 400);
        let baseColor = "rgba(227, 146, 250,";
        if (color === "#add8e6") baseColor = "rgba(173, 216, 230,";
        if (color === "#00ff55") baseColor = "rgba(0, 255, 85,";
        gradient.addColorStop(0, `${baseColor} 0.5)`);
        gradient.addColorStop(1, `${baseColor} 0.0)`);
        return gradient;
      }

      // ================= UI: Server Config =================
      const serverBtn = document.getElementById("serverSubmitBtn");
      serverBtn.addEventListener("click", () => {
        const editDiv = document.getElementById("server-edit");
        const dispDiv = document.getElementById("server-display");
        if (isEditing) {
          const addr = document.getElementById("serverAddress").value.trim();
          const port = document.getElementById("serverPort").value.trim();
          if (!addr || !port) return;
          SERVER_URL = `http://${addr}:${port}`;
          document.getElementById("serverUrlSpan").textContent = SERVER_URL;
          editDiv.style.display = "none";
          dispDiv.style.display = "flex";
          serverBtn.textContent = "Edit";
          isEditing = false;
          refreshData();
        } else {
          const [a, p] = SERVER_URL.replace("http://", "").split(":");
          document.getElementById("serverAddress").value = a || "";
          document.getElementById("serverPort").value = p || "";
          dispDiv.style.display = "none";
          editDiv.style.display = "flex";
          serverBtn.textContent = "Set";
          isEditing = true;
        }
      });

      // ================= UI: Sidebar Management =================
      const nodeList = document.getElementById("node-list");
      const walletList = document.getElementById("wallet-list");
      const nodeInput = document.getElementById("nodeInput");
      const walletInput = document.getElementById("walletInput");

      function renderSidebar() {
        // --- VISUAL LIMIT LOGIC FOR NODES ---
        if (trackedNodes.length >= MAX_ITEMS) {
          nodeInput.disabled = true;
          nodeInput.placeholder = "Max limit reached";
          nodeInput.parentElement.style.opacity = "0.5";
          nodeInput.parentElement.style.pointerEvents = "none";
        } else {
          nodeInput.disabled = false;
          nodeInput.placeholder = "Add Node (ID or Nickname)";
          nodeInput.parentElement.style.opacity = "1";
          nodeInput.parentElement.style.pointerEvents = "auto";
        }

        // Render Nodes
        nodeList.innerHTML = "";
        trackedNodes.forEach((key, idx) => {
          const card = document.createElement("div");
          card.className =
            "node-card" +
            (activeType === "NODE" && activeIndex === idx
              ? " active-node"
              : "");
          const nameSpan = document.createElement("span");
          nameSpan.textContent =
            nodeNameCache[key] || key.substring(0, 12) + "...";
          const delSpan = document.createElement("span");
          delSpan.textContent = "✕";
          delSpan.onclick = (e) => {
            e.stopPropagation();
            removeNode(idx);
          };
          card.appendChild(nameSpan);
          card.appendChild(delSpan);
          card.onclick = () => selectItem("NODE", idx);
          nodeList.appendChild(card);
        });

        // --- VISUAL LIMIT LOGIC FOR WALLETS ---
        if (trackedWallets.length >= MAX_ITEMS) {
          walletInput.disabled = true;
          walletInput.placeholder = "Max limit reached";
          walletInput.parentElement.style.opacity = "0.5";
          walletInput.parentElement.style.pointerEvents = "none";
        } else {
          walletInput.disabled = false;
          walletInput.placeholder = "Add Wallet Public Key";
          walletInput.parentElement.style.opacity = "1";
          walletInput.parentElement.style.pointerEvents = "auto";
        }

        // Render Wallets
        walletList.innerHTML = "";
        trackedWallets.forEach((key, idx) => {
          const card = document.createElement("div");
          card.className =
            "node-card" +
            (activeType === "WALLET" && activeIndex === idx
              ? " active-wallet"
              : "");
          const nameSpan = document.createElement("span");
          nameSpan.textContent = key.substring(0, 8) + "...";
          const delSpan = document.createElement("span");
          delSpan.textContent = "✕";
          delSpan.onclick = (e) => {
            e.stopPropagation();
            removeWallet(idx);
          };
          card.appendChild(nameSpan);
          card.appendChild(delSpan);
          card.onclick = () => selectItem("WALLET", idx);
          walletList.appendChild(card);
        });
      }

      function selectItem(type, index) {
        activeType = type;
        activeIndex = index;
        document.getElementById("node-view").classList.remove("active");
        document.getElementById("wallet-view").classList.remove("active");

        if (type === "NODE") {
          document.getElementById("node-view").classList.add("active");
          if (myChart) setTimeout(() => myChart.resize(), 100);
        } else {
          document.getElementById("wallet-view").classList.add("active");
        }
        renderSidebar();
        refreshData();
      }

      function clearMainView() {
        activeType = null;
        activeIndex = null;
        document.getElementById("node-view").classList.remove("active");
        document.getElementById("wallet-view").classList.remove("active");
      }

      function removeNode(idx) {
        if (activeType === "NODE" && activeIndex === idx) {
          clearMainView();
        } else if (activeType === "NODE" && activeIndex > idx) {
          activeIndex--;
        }
        trackedNodes.splice(idx, 1);
        renderSidebar();
      }

      function removeWallet(idx) {
        if (activeType === "WALLET" && activeIndex === idx) {
          clearMainView();
        } else if (activeType === "WALLET" && activeIndex > idx) {
          activeIndex--;
        }
        trackedWallets.splice(idx, 1);
        renderSidebar();
      }

      nodeInput.addEventListener("keydown", async (e) => {
        if (e.key === "Enter") {
          // LIMIT CHECK (Should be blocked by UI but double check)
          if (trackedNodes.length >= MAX_ITEMS) return;

          let val = nodeInput.value.trim();
          if (!val) return;
          if (SERVER_URL) {
            try {
              const r = await fetch(
                `${SERVER_URL}/resolve_nickname/${encodeURIComponent(val)}`,
              );
              const d = await r.json();
              if (d.status === "found") {
                val = d.pubkey;
                nodeNameCache[val] = d.nickname;
              }
            } catch (e) {}
          }
          if (!trackedNodes.includes(val)) {
            trackedNodes.push(val);
            selectItem("NODE", trackedNodes.length - 1);
          }
          nodeInput.value = "";
        }
      });

      walletInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          if (trackedWallets.length >= MAX_ITEMS) return;

          const val = walletInput.value.trim();
          if (!val) return;
          if (!trackedWallets.includes(val)) {
            trackedWallets.push(val);
            selectItem("WALLET", trackedWallets.length - 1);
          }
          walletInput.value = "";
        }
      });

      // ================= DATA LOGIC =================
      async function refreshData() {
        if (!SERVER_URL || activeType === null) return; // Don't fetch if on default view
        const t = Date.now();
        try {
          const [chainRes, mempoolRes] = await Promise.all([
            fetch(`${SERVER_URL}/chain?t=${t}`),
            fetch(`${SERVER_URL}/mempool?t=${t}`),
          ]);
          if (!chainRes.ok || !mempoolRes.ok) throw new Error("API Error");
          const chain = await chainRes.json();
          const mempool = await mempoolRes.json();
          const serverDate = new Date(
            chainRes.headers.get("Date") || Date.now(),
          );

          if (activeType === "NODE")
            updateNodeStats(chain, mempool, serverDate);
          else if (activeType === "WALLET") updateWalletStats(chain, mempool);
        } catch (err) {
          console.error(err);
        }
      }

      async function updateNodeStats(chain, mempool, serverNow) {
        if (activeIndex === null || !trackedNodes[activeIndex]) return;
        const currentNodeRaw = trackedNodes[activeIndex];
        const cleanID = cleanKey(currentNodeRaw);

        fetch(
          `${SERVER_URL}/node_nickname/${encodeURIComponent(cleanID)}?t=${Date.now()}`,
        )
          .then((r) => r.json())
          .then((d) => {
            if (d.status === "found")
              nodeNameCache[currentNodeRaw] = d.nickname;
            renderSidebar();
          })
          .catch((e) => {});

        let rawHistory = [];
        const processTx = (tx, isMempool) => {
          if (
            tx.type === "MINT" &&
            cleanKey(tx.from_addr) === cleanID &&
            tx.reading
          ) {
            const cleanTime = tx.timestamp
              .replace(" UTC", "")
              .trim()
              .replace(/-/g, "/");
            const dt = new Date(cleanTime + " UTC");
            if (!isNaN(dt.getTime())) {
              rawHistory.push({
                timeObj: dt,
                temp: tx.reading.temperature,
                pres: tx.reading.pressure,
                hum: tx.reading.humidity,
                isPending: isMempool,
                signature: tx.signature,
              });
            }
          }
        };
        chain.forEach((b) =>
          b.transactions.forEach((tx) => processTx(tx, false)),
        );
        mempool.forEach((tx) => processTx(tx, true));
        rawHistory.sort((a, b) => a.timeObj - b.timeObj);

        let smoothHistory = [];
        let totalActiveMs = 0;
        let lastTime = 0;
        const IDLE_CUTOFF = 20000;

        if (rawHistory.length > 0) {
          smoothHistory.push(rawHistory[0]);
          lastTime = rawHistory[0].timeObj.getTime();
          for (let i = 1; i < rawHistory.length; i++) {
            const p = rawHistory[i];
            const diff = p.timeObj.getTime() - lastTime;
            if (diff < IDLE_CUTOFF && diff > 0) totalActiveMs += diff;
            if (diff > 60000)
              smoothHistory.push({
                timeObj: p.timeObj,
                temp: null,
                pres: null,
                hum: null,
              });
            if (diff >= 1000) {
              smoothHistory.push(p);
              lastTime = p.timeObj.getTime();
            }
          }
        }
        cachedChartData = smoothHistory.slice(-60);

        const latest = rawHistory[rawHistory.length - 1];
        let status = "OFFLINE";
        if (latest) {
          if (lastKnownSig[cleanID] !== latest.signature) {
            lastKnownSig[cleanID] = latest.signature;
            lastHeartbeat[cleanID] = Date.now();
          }
          const msSince = Date.now() - (lastHeartbeat[cleanID] || 0);
          if (latest.isPending) {
            status = "ONLINE";
            lastHeartbeat[cleanID] = Date.now();
          } else if (msSince < 60000)
            status = msSince < 20000 ? "ONLINE" : "IDLE";
          else {
            const sDiff = (serverNow - latest.timeObj) / 1000;
            if (sDiff < 25) status = "ONLINE";
            else if (sDiff < 60) status = "IDLE";
          }
        }

        if (latest && status !== "OFFLINE") {
          document.getElementById("tempDisplay").textContent =
            latest.temp.toFixed(2) + " °C";
          document.getElementById("presDisplay").textContent =
            latest.pres.toFixed(2) + " hPa";
          document.getElementById("humDisplay").textContent =
            latest.hum.toFixed(2) + " %";
          renderChartFromCache();
        } else {
          resetTopStats("--");
        }

        // --- FIXED: Calculate Last Sync ---
        let lastSyncStr = "Never";
        if (latest) {
          lastSyncStr = latest.timeObj.toLocaleTimeString();
        }
        // ----------------------------------

        const mins = Math.floor(totalActiveMs / 60000);
        const secs = Math.floor((totalActiveMs % 60000) / 1000);
        const cName = nodeNameCache[currentNodeRaw] || "unknown";
        const cId = cleanKey(currentNodeRaw);
        let statusHtml =
          status === "ONLINE"
            ? `<span class="detail-val-green">Online</span>`
            : status === "IDLE"
              ? `<span class="detail-val-yellow">Idle</span>`
              : `<span class="detail-val-red">Offline</span>`;

        document.getElementById("node-details").innerHTML = `
           <h3 class="details-header">Details</h3>
           <div class="detail-row"><span class="detail-label">Node name:</span><span class="detail-val-purple">${cName}</span></div>
           <div class="detail-row"><span class="detail-label">Node ID:</span><span class="detail-val-white">${cId}</span></div>
           <div class="detail-row"><span class="detail-label">Status:</span>${statusHtml}</div>
           <div class="detail-row"><span class="detail-label">Last Sync:</span><span class="detail-val-white">${lastSyncStr}</span></div>
           <div class="detail-row"><span class="detail-label">Active Time:</span><span class="detail-val-white">${mins}m ${secs}s</span></div>
        `;
      }

      function updateWalletStats(chain, mempool) {
        if (activeIndex === null || !trackedWallets[activeIndex]) return;
        const currentWallet = cleanKey(trackedWallets[activeIndex]);

        let confirmed = 0;
        let pending = 0;
        let txList = [];
        const scanTx = (tx, isMem) => {
          const from = cleanKey(tx.from_addr);
          const to = cleanKey(tx.to_addr);
          if (from !== currentWallet && to !== currentWallet) return;
          let amount = tx.amount;
          let type = tx.type;
          if (isMem) {
            if (type === "MINT" && to === currentWallet) pending += amount;
            if (type === "TRANSFER") {
              if (to === currentWallet) pending += amount;
              if (from === currentWallet) pending -= amount;
            }
          } else {
            if (type === "MINT" && to === currentWallet) confirmed += amount;
            if (type === "TRANSFER") {
              if (to === currentWallet) confirmed += amount;
              if (from === currentWallet) confirmed -= amount;
            }
          }
          txList.push({
            time: tx.timestamp,
            type: type,
            amount: amount,
            isInbound: to === currentWallet,
            isMem: isMem,
          });
        };

        chain.forEach((b) => b.transactions.forEach((tx) => scanTx(tx, false)));
        mempool.forEach((tx) => scanTx(tx, true));

        document.getElementById("walletConfirmed").textContent =
          confirmed.toFixed(2);
        document.getElementById("walletPending").textContent =
          pending.toFixed(2);
        document.getElementById("walletTotal").textContent = (
          confirmed + pending
        ).toFixed(2);

        const listDiv = document.getElementById("txHistory");
        listDiv.innerHTML = "";
        if (txList.length === 0) {
          listDiv.innerHTML =
            '<div style="text-align: center; color: #666; margin-top: 50px;">No transactions found</div>';
        } else {
          txList.reverse().forEach((tx) => {
            const row = document.createElement("div");
            row.className = "tx-row";
            const typeSpan = `<span class="${tx.type === "MINT" ? "tx-type-mint" : "tx-type-transfer"}">${tx.type}</span>`;
            const sign = tx.isInbound ? "+" : "-";
            const color = tx.isInbound ? "#00ff55" : "#ff0059";
            row.innerHTML = `
                  <div style="display:flex; flex-direction:column; gap:2px;">
                     ${typeSpan}
                     <span class="tx-time">${tx.time} ${tx.isMem ? "(Pending)" : ""}</span>
                  </div>
                  <div class="tx-amount" style="color: ${color}">${sign}${tx.amount.toFixed(2)}</div>
                `;
            listDiv.appendChild(row);
          });
        }
        document.getElementById("wallet-details-text").innerHTML = `
           <h3 class="details-header" style="color: var(--accent-blue)">Details</h3>
           <div class="detail-row"><span class="detail-label">Wallet ID:</span><span class="detail-val-white">${currentWallet}</span></div>
           <div class="detail-row"><span class="detail-label">Total Tx:</span><span class="detail-val-blue">${txList.length}</span></div>
         `;
      }

      // ================= CHART LOGIC =================
      function initChart() {
        const ctx = document.getElementById("trendChart").getContext("2d");
        myChart = new Chart(ctx, {
          type: "line",
          data: {
            labels: [],
            datasets: [
              {
                label: "Temp",
                data: [],
                borderColor: "#e392fa",
                tension: 0.3,
                borderWidth: 2,
                pointRadius: 2,
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: { x: { display: false }, y: { grid: { color: "#333" } } },
          },
        });
      }
      function setGraphMode(mode) {
        currentMode = mode;
        document.querySelectorAll(".tab").forEach((b) => {
          b.classList.remove("active");
          if (b.textContent.toLowerCase().includes(mode.substring(0, 3)))
            b.classList.add("active");
        });

        const config = MODES[mode];
        const dataset = myChart.data.datasets[0];
        dataset.borderColor = config.color;
        dataset.pointBackgroundColor = config.color;
        if (config.gradient) {
          dataset.fill = true;
          dataset.backgroundColor = createGradient(
            document.getElementById("trendChart").getContext("2d"),
            config.color,
          );
        } else {
          dataset.fill = false;
          dataset.backgroundColor = config.color;
        }

        renderChartFromCache();
      }
      function renderChartFromCache() {
        if (!myChart || cachedChartData.length === 0) return;
        const plotData = cachedChartData.map((h) => h[currentMode]);
        const valid = plotData.filter((v) => v !== null);
        const min = Math.min(...valid);
        const max = Math.max(...valid);
        const cfg = Y_SCALES[currentMode];

        if (valid.length > 0) {
          myChart.options.scales.y.min = Math.floor(min - cfg.buffer);
          myChart.options.scales.y.max = Math.ceil(max + cfg.buffer);

          // --- FIX: ADDED UNITS HERE ---
          const unit = MODES[currentMode].unit;
          document.getElementById("highVal").textContent =
            `${Math.max(...valid).toFixed(1)} ${unit}`;
          document.getElementById("lowVal").textContent =
            `${Math.min(...valid).toFixed(1)} ${unit}`;
        }
        myChart.data.labels = cachedChartData.map((h) =>
          h.timeObj.toLocaleTimeString(),
        );
        myChart.data.datasets[0].data = plotData;
        myChart.update();
      }
      function resetTopStats(msg) {
        document.getElementById("tempDisplay").textContent = msg;
        document.getElementById("presDisplay").textContent = msg;
        document.getElementById("humDisplay").textContent = msg;
        cachedChartData = [];
        if (myChart) {
          myChart.data.labels = [];
          myChart.data.datasets[0].data = [];
          myChart.update();
        }
      }

      // ================= STARTUP =================
      initChart();
      setGraphMode(currentMode);
      renderSidebar();
      function startLoop() {
        refreshData().finally(() => setTimeout(startLoop, 1000));
      }
      startLoop();
    </script>
  </body>
</html>
